name: Deploy site
# Third-party actions are pinned to a commit (the tag is in the comment).
# main -> tests -> staging -> checks on staging -> production.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm test
      - run: npm run check:links
      - run: npm run build:staging
      - name: Deploy to staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.166.0 deploy --env staging
      - name: Check staging answers
        run: node tools/check-site.js https://housetandem-web-staging.pete-872.workers.dev
      - name: Why the deploy failed
        if: failure()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "token set: $([ -n "$CLOUDFLARE_API_TOKEN" ] && echo yes || echo no), length ${#CLOUDFLARE_API_TOKEN}"
          curl -sS -m 15 -o verify.json -w 'token verify: HTTP %{http_code}\n' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify || true
          node -e 'try{const r=JSON.parse(require("fs").readFileSync("verify.json"));console.log(JSON.stringify({success:r.success,status:r.result&&r.result.status,errors:r.errors}))}catch(e){console.log("no answer")}'
          grep -hiE 'cause|ECONN|ENOTFOUND|ETIMEDOUT|EAI_AGAIN|UND_ERR|certificate|invalid' "$HOME"/.config/.wrangler/logs/*.log 2>/dev/null | grep -vi 'authorization' | tail -12 | cut -c1-220 || true

  production:
    needs: staging
    # Stays off until the site has moved from GitHub Pages (repository variable).
    if: vars.CF_PRODUCTION_LIVE == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm run build
      - name: Deploy to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.166.0 deploy
      - name: Check production answers
        run: node tools/check-site.js https://housetandem.com --wait 420
