name: test
# Third-party actions are pinned to a commit (the tag is in the comment).
on:
  pull_request:
  push:
    branches: [main]

# Runs the branch's own code, so it gets no secrets and can only read.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm test
      - run: npm run check:links

      # The static files for this PR's preview. preview-site.yml publishes them from
      # main's own workflow, so the branch's code never runs with the Cloudflare token.
      - name: Build the preview
        if: github.event_name == 'pull_request'
        run: npm run build:staging
      - name: Note which PR this is
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: printf '%s' "$PR_NUMBER" > pr-number.txt
      - name: Keep the preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-preview
          path: |
            public/
            pr-number.txt
          retention-days: 3
